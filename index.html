<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prog Folia 2027 | Memento Vivere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08080c;
      --card-bg: rgba(20, 20, 32, 0.75);
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff0055;
      --neon-lime: #39ff14;
      --neon-amber: #ffaa00;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-glow: rgba(0, 243, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(255, 0, 85, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 243, 255, 0.12) 0%, transparent 40%);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      padding: 3rem 1.5rem 2rem;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border: 1px solid var(--neon-cyan);
      border-radius: 50px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 1rem;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 0%, var(--neon-cyan) 60%, var(--neon-magenta) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 1.25rem;
      color: var(--text-muted);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    main {
      max-width: 1050px;
      margin: 0 auto;
      padding: 1rem 1.5rem 5rem;
    }

    /* Banner Modo Teste Ativo */
    .test-banner {
      background: rgba(255, 170, 0, 0.1);
      border: 1px solid var(--neon-amber);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 2.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 0 20px rgba(255, 170, 0, 0.15);
    }

    .test-banner-icon {
      font-size: 1.8rem;
    }

    .test-banner-text strong {
      color: var(--neon-amber);
      font-family: 'Orbitron', sans-serif;
      display: block;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    .test-banner-text span {
      font-size: 0.95rem;
      color: #ffd899;
    }

    .grid-tickets {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 2rem;
      margin-bottom: 3.5rem;
    }

    .ticket-card {
      background: var(--card-bg);
      border: 1px solid var(--border-glow);
      border-radius: 18px;
      padding: 2.2rem 1.8rem;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
